<nav class="navbar">
  <ul class="nav-list">
    @for (item of navItems; track item) {
      <li class="nav-item">
        <a [routerLink]="[item.route]" routerLinkActive="active" [routerLinkActiveOptions]="{exact: item.route === '/'}">
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
